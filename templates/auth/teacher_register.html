<!-- Teacher registration form. -->
{% extends 'base.html' %}{% block title %}Teacher Registration{% endblock %}{% block content %}<section class="auth-card"><h1>Create teacher account</h1><p>Register as a teacher to manage exams and questions.</p><form method="post">{{ form.hidden_tag() }}<label>{{ form.name.label }}{{ form.name() }}</label><label>{{ form.email.label }}{{ form.email(placeholder='teacher@example.com') }}</label><label>{{ form.department.label }}{{ form.department() }}</label><label>{{ form.password.label }}{{ form.password() }}</label><label>{{ form.confirm_password.label }}{{ form.confirm_password() }}</label>{{ form.submit(class_='button full') }}</form><p><a href="{{ url_for('main.home') }}">Back to home</a></p></section>{% endblock %}
