<!-- Student search and listing page. -->
{% extends 'base.html' %}{% block content %}<h1>Students</h1><form class="search" method="get"><input name="q" value="{{ query }}" placeholder="Search name or email"><button class="button small">Search</button></form><section class="panel"><table><thead><tr><th>Name</th><th>Email</th><th>Exams completed</th></tr></thead><tbody>{% for student in students %}<tr><td>{{ student.name }}</td><td>{{ student.email }}</td><td>{{ student.results|length }}</td></tr>{% else %}<tr><td colspan="3">No students found.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
